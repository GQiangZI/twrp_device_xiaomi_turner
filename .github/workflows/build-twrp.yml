name: Build TWRP (turner) — YARP base

# YARP base: TWRP-Test/platform_manifest_twrp_aosp, branch twrp-16.0
# (TWRP 3.7.1_16, GUI2/LVGL) + PR #42 (OTG hotplug fix, applied below).
# Device tree is this repo itself (checked out as device-tree, then copied
# to device/xiaomi/turner). Builds vendor_boot.img (recovery lives in
# vendor_boot on turner; there is no dedicated recovery partition).
# Dispatch: Actions -> Build TWRP (turner) — YARP base -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      TWRP_MANIFEST_BRANCH:
        description: "TWRP branch"
        required: true
        default: "twrp-16.0"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch (this repo)"
        required: true
        default: "main"
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "vendor_boot"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        # explicit bash adds pipefail; without it a failed `m | tee` passed as success
        shell: bash
    steps:
    - name: Show build info
      run: |
        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Manifest url: ${{ github.event.inputs.TWRP_MANIFEST_URL }}
          echo Manifest branch: ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: xiaomi/turner
          echo Device name: turner
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Build date: `date`
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    - name: Setup zram
      # Best effort only: the 14.1 build succeeded without zram, and the
      # runner kernel (7.0.0-1017-azure) has no linux-modules-extra package
      # in apt, so a failed zram setup must never kill the build.
      run: |
        sudo apt-get update -y || true
        sudo apt-get install -y zram-tools || true
        sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
        if sudo modprobe zram 2>/dev/null; then
          [ -f /etc/default/zramswap ] && sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap || true
          [ -f /etc/default/zramswap ] && sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap || true
          sudo systemctl restart zramswap || true
          zramctl || true
          echo "::notice title=Zram::enabled"
        else
          echo "::warning title=Zram::zram module unavailable, building without zram swap"
        fi
        exit 0

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update && sudo apt upgrade -y
        sudo apt install repo -y
        # zstd is required by patches/build_make (ramdisk compression);
        # the rest are the standard AOSP build tools
        for i in 1 2 3; do sudo apt-get -o Acquire::Retries=3 update && break; sleep 15; done
        sudo apt-get -o Acquire::Retries=3 install -y bc bison build-essential curl flex git gnupg gperf libssl-dev \
          libxml2-utils lz4 python-is-python3 rsync unzip xsltproc zip zlib1g-dev zstd
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com

    - uses: actions/checkout@v4
      with:
        path: device-tree
        ref: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}

    - name: Sync TWRP 16.0 (YARP) source
      run: |
        repo init -u ${{ github.event.inputs.TWRP_MANIFEST_URL }} -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
        kill $TIP_PID && exit 0
        echo "::notice title=Disk after sync::$(df -h --output=avail / | tail -1) free"

    - name: Apply PR #42 (OTG hotplug fix for GUI2)
      # repo sync used --depth=1, so the local history has no common ancestor
      # with the PR branch and plain `git merge` refuses with "unrelated
      # histories". Unshallow first so the merge base is found.
      run: |
        cd bootable/recovery
        git fetch --unshallow
        git fetch https://github.com/TWRP-Test/android_bootable_recovery.git pull/42/head
        git merge --no-edit FETCH_HEAD

    - name: Setup device tree
      run: |
        mkdir -p device/xiaomi
        cp -a device-tree device/xiaomi/turner
        echo -e "$BUILD_INFO" > device/xiaomi/turner/INFO.txt
        echo "Change log:" >> device/xiaomi/turner/INFO.txt
        git -C device-tree log --pretty=format:"- %h-%an: %s" -20 >> device/xiaomi/turner/INFO.txt

    - name: Apply device-tree patches
      run: |
        # patches/<project path with / as _>/*.patch, e.g. build_make -> build/make
        # (see patches/PATCHES.md for which 14.1 patches were dropped on 16.0 and why)
        for d in device/xiaomi/turner/patches/*/; do
          t=$(basename "$d"); t=${t//_//}
          for p in "$d"*.patch; do git -C "$t" apply "$GITHUB_WORKSPACE/$p"; done
        done

    - name: Build vendor_boot.img
      run: |
        {
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          export CCACHE_DIR=.ccache
          export CCACHE_EXEC=$(command -v ccache)
          export CCACHE_MAXSIZE=5G
          export USE_CCACHE=1
          lunch twrp_turner
          (while true; do echo `date +%T` "Building TWRP..."; free -h; sleep 60; done) &
          TIP_PID=$!
          m ${{ github.event.inputs.BUILD_PARTITION }}image
          kill $TIP_PID
          # TWRP's relink lists lag behind vold (keystore2-V1 vs V4, ...) and copy the bootstrap
          # servicemanager: fill the gaps in recovery/root, then repack if anything changed
          fixed=$(python3 device/xiaomi/turner/.github/scripts/recovery_deps.py \
            out/target/product/turner/recovery/root \
            out/target/product/turner/system/lib64 out/target/product/turner/system_ext/lib64 \
            out/target/product/turner/vendor/lib64 out/soong/.intermediates) ||
            echo "::warning title=Recovery deps::some libraries were not found in the build output"
          if [ -n "$fixed" ]; then
            echo "::notice title=Added to recovery::$(echo "$fixed" | tr '\n' ';')"
            rm -rf out/target/product/turner/vendor_boot.img out/target/product/turner/vendor_ramdisk*.img \
              out/target/product/turner/obj/PACKAGING/vendor_boot_intermediates
            m ${{ github.event.inputs.BUILD_PARTITION }}image
          fi
        } 2>&1 | tee build.log
        cd out/target/product/turner
        sha256sum vendor_boot.img | tee vendor_boot.img.sha256
        echo "::notice title=vendor_boot.img::$(stat -c%s vendor_boot.img) bytes, sha256 $(cut -d' ' -f1 vendor_boot.img.sha256)"

    # Surface the compiler error as an annotation so it is readable without downloading logs
    - name: Report build error
      if: failure()
      run: |
        f="build.log"
        [ -s "$f" ] || exit 0
        msg=$(tail -c 3500 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
        echo "::error title=Build error::$msg"
        u=$(grep -o 'undefined symbol: [^ ]*' "$f" | cut -d' ' -f3 | sort -u | c++filt | head -80 | tr '\n' ';' || true)
        [ -z "$u" ] || echo "::error title=Undefined symbols::$u"
        e=$(sed 's/\x1b\[[0-9;]*m//g' "$f" | grep -E ': (fatal )?error: ' | sort -u | head -40 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' || true)
        [ -z "$e" ] || echo "::error title=All compile errors::$e"
        echo "::notice title=Disk at failure::$(df -h --output=target,avail / /mnt | tail -n +2 | tr -s ' ' | tr '\n' ' ')"

    - uses: actions/upload-artifact@v4
      with:
        name: twrp-turner-vendor_boot-${{ github.run_number }}
        path: |
          out/target/product/turner/vendor_boot.img
          out/target/product/turner/vendor_boot.img.sha256
